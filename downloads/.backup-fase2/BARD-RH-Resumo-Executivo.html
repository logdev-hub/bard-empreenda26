<style>:root{--bg:#111111;--card:#1E1E1E;--gold:#C9A227;--gold-d:#8A6D12;--paper:#F5F5F3;--ink:#111111;--mute:#5F5F5F;--line:#D9D6CC;--gold-t:#F6EBC2;--gold-t2:#FBF5DE}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#2a2a2a;font-family:Carlito,Calibri,'Segoe UI',Arial,sans-serif;color:var(--ink)}
a{color:inherit;text-decoration:none}
/* ---------- casca da aplicação (fora do slide) ---------- */
#app{display:flex;flex-direction:column;height:100vh}
#bar{flex:0 0 auto;background:#0b0b0b;border-bottom:2px solid var(--gold);padding:.4rem .75rem;display:flex;gap:.6rem;align-items:center;color:#fff}
#bar .brand{font-family:Poppins,sans-serif;font-weight:700;letter-spacing:.04em;font-size:.95rem;color:var(--gold);white-space:nowrap}
#bar .brand img{height:26px;vertical-align:middle;margin-right:.45rem}
#bar .btn-gold{background:var(--gold);border-color:var(--gold);color:#111;font-weight:700;font-size:.85rem;padding:.25rem .7rem}
#bar .btn-gold:hover{background:#dcb63b}
#bar .btn-ghost{background:transparent;border:1px solid #555;color:#ddd;font-size:.85rem;padding:.25rem .6rem}
#bar .btn-ghost:hover{border-color:var(--gold);color:var(--gold)}
#bar #q{max-width:340px;background:#1b1b1b;border:1px solid #444;color:#fff;font-size:.88rem}
#bar #q::placeholder{color:#888}
#bar .cnt{font-size:.85rem;color:#bbb;white-space:nowrap}
#bar #goto{width:64px;background:#1b1b1b;border:1px solid #444;color:#fff;font-size:.85rem;text-align:center}
#stagewrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
#stage{width:1280px;height:720px;transform-origin:center center;flex:0 0 auto;box-shadow:0 8px 40px #000a}
.offcanvas{background:#151515;color:#eee;width:420px!important}
.offcanvas-header{border-bottom:1px solid #333}
.offcanvas-title{font-family:Poppins,sans-serif;color:var(--gold);font-size:1rem}
.offcanvas .accordion{--bs-accordion-bg:#151515;--bs-accordion-color:#eee;--bs-accordion-border-color:#2d2d2d;--bs-accordion-btn-bg:#151515;--bs-accordion-active-bg:#1f1b0d;--bs-accordion-active-color:var(--gold);--bs-accordion-btn-focus-box-shadow:none}
.offcanvas .accordion-button{font-size:.92rem;font-weight:700;color:#eee;background:#151515}
.offcanvas .accordion-button:not(.collapsed){color:var(--gold);background:#1f1b0d}
.offcanvas .accordion-button::after{filter:invert(1)}
.offcanvas .accordion-body{padding:.35rem .6rem .7rem}
.offcanvas .sechd{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin:.6rem 0 .15rem;font-weight:700}
.offcanvas .it{display:flex;gap:.5rem;padding:.18rem .3rem;border-radius:4px;font-size:.84rem;color:#ddd;cursor:pointer}
.offcanvas .it:hover{background:#262626;color:#fff}
.offcanvas .it.cur{background:var(--gold);color:#111;font-weight:700}
.offcanvas .it .n{flex:0 0 2.2rem;color:#888;text-align:right}
.offcanvas .it.cur .n{color:#111}
#results .it .st{color:#999;font-size:.74rem;display:block}
/* ---------- slide ---------- */
.slide{width:1280px;height:720px;position:relative;background:var(--paper);overflow:hidden;display:flex;flex-direction:column;font-size:16px}
.slide.dark{background:var(--bg);color:#fff}
.slide .nav{flex:0 0 48px;background:#0b0b0b;display:flex;align-items:center;gap:6px;padding:0 18px 0 14px;border-bottom:2px solid var(--gold)}
.slide .nav .menu{background:var(--gold);color:#111;font-weight:700;font-size:13px;letter-spacing:.05em;padding:6px 14px;border-radius:5px;white-space:nowrap}
.slide .nav .tabs{display:flex;gap:4px;margin-left:12px;flex:1}
.slide .nav .tab{color:#cfcfcf;font-size:14px;padding:7px 14px;border-radius:5px;white-space:nowrap;border:1px solid transparent}
.slide .nav .tab:hover{border-color:#555;color:#fff}
.slide .nav .tab.on{background:#2a2410;color:var(--gold);border-color:var(--gold);font-weight:700}
.slide .nav img.logo{height:34px;margin-left:8px}
.slide .body{flex:1;min-height:0;display:flex;flex-direction:column;padding:14px 40px 0}
.slide .head{flex:0 0 auto;margin-bottom:10px}
.slide .kick{font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--gold-d);font-weight:700;margin-bottom:2px}
.slide .title{font-family:Poppins,sans-serif;font-weight:700;margin:0;line-height:1.18;color:var(--ink)}
.slide .sub{color:var(--mute);margin-top:5px;line-height:1.28}
.slide .content{flex:1;min-height:0;overflow:hidden;font-size:var(--fs,16px);position:relative;padding:0 2px 6px}
.slide .note{flex:0 0 auto;margin:8px 0 8px;padding:6px 12px;border-left:4px solid var(--gold);background:var(--gold-t2);font-size:13px;line-height:1.3;color:#3a3a3a}
.slide .foot{flex:0 0 32px;display:flex;align-items:center;gap:14px;padding:0 24px 0 40px;font-size:12.5px;color:var(--mute);border-top:1px solid var(--line);background:#EEEDE8}

.slide .foot .src{white-space:nowrap}
.slide .foot .crumb{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slide .foot a{color:var(--gold-d);font-weight:700}
.slide.dark .foot a{color:var(--gold)}
.slide .foot .pg{display:flex;gap:8px;align-items:center;white-space:nowrap}
.slide .foot .pg a{font-size:15px;padding:0 8px;border:1px solid var(--gold);border-radius:4px;line-height:20px}
.slide .foot .pg a.off{opacity:.25;pointer-events:none}
/* selos */
.chip{display:inline-block;font-size:.66em;font-weight:700;letter-spacing:.05em;padding:.12em .55em;border-radius:99px;color:#fff;vertical-align:middle;white-space:nowrap}
.tag-V{background:#2F7D4F}.tag-R{background:#3B6EA5}.tag-E{background:#B58B0A}.tag-C{background:#C2571A}.tag-H{background:#6B6B6B}
.tagbar{display:inline-flex;gap:6px;align-items:center}
/* ---------- layouts ---------- */
.stats{display:grid;gap:18px;height:100%;align-content:stretch}
.stats .st{background:#fff;border-top:6px solid var(--gold);border-radius:6px;padding:18px 24px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 1px 3px #0002;position:relative}
.stats .v{font-family:Poppins,sans-serif;font-weight:700;color:var(--gold-d);line-height:1.05}
.stats .l{margin-top:10px;font-size:1.08em;line-height:1.3;color:#222}
.stats .st .chip{position:absolute;right:14px;top:12px}
.cards{display:grid;gap:14px;grid-auto-rows:auto}
.cards .cd{background:#fff;border-left:6px solid var(--gold);border-radius:6px;padding:.8em 1em;box-shadow:0 1px 3px #0002;position:relative}
.cards .cd h4{font-family:Poppins,sans-serif;font-weight:700;margin:0 0 .35em;font-size:1.05em;line-height:1.2;color:var(--ink)}
.cards .cd p{margin:0;line-height:1.32;color:#2a2a2a;font-size:.98em}
table.t{width:100%;border-collapse:collapse;font-size:1em;background:#fff;box-shadow:0 1px 3px #0002}
table.t th{background:var(--bg);color:#fff;text-align:left;padding:.45em .7em;font-weight:700;font-size:.95em;border-right:1px solid #333}
table.t th:last-child{border-right:0}
table.t td{padding:calc(.4em + var(--tp,0px)) .7em;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.25}
table.t tr:nth-child(even) td{background:#FBFAF6}
table.t tr.hl td{background:var(--gold-t)!important;font-weight:700}
table.t td.f{font-weight:700;color:#000}
.bars{display:flex;flex-direction:column;gap:.55em;height:100%;justify-content:center}
.bars .br{display:grid;grid-template-columns:24% 1fr 12%;gap:14px;align-items:center}
.bars .bl{text-align:right;font-weight:700;font-size:1.05em}
.bars .bt{background:#E7E5DC;border-radius:4px;height:2.1em;overflow:hidden}
.bars .bf{height:100%;background:#9a9a9a;border-radius:4px}
.bars .bf.hl{background:var(--gold)}
.bars .bv{font-family:Poppins,sans-serif;font-weight:700;color:var(--gold-d)}
.chartbox{position:absolute;inset:0}
.chartbox svg{display:block;width:100%;height:100%}
.steps{display:grid;gap:16px;grid-auto-rows:auto;align-items:stretch}
.steps .sp{background:#fff;border-top:5px solid var(--gold);border-radius:6px;padding:.8em .9em;box-shadow:0 1px 3px #0002;position:relative}
.steps .sp .n{display:inline-flex;width:2em;height:2em;border-radius:50%;background:var(--bg);color:var(--gold);font-family:Poppins,sans-serif;font-weight:700;align-items:center;justify-content:center;margin-bottom:.5em;font-size:1.05em}
.steps .sp h4{font-family:Poppins,sans-serif;font-weight:700;margin:0 0 .3em;font-size:1.02em;line-height:1.2}
.steps .sp p{margin:0;line-height:1.3;font-size:.96em;color:#2a2a2a}
.steps .sp:not(:last-child)::after{content:"▶";position:absolute;right:-13px;top:50%;font-size:14px;color:var(--gold);z-index:2}
.steps.wrap .sp::after{display:none}
.cmp{display:grid;gap:18px;align-items:stretch}
.cmp .cc{background:#fff;border-radius:6px;overflow:hidden;box-shadow:0 1px 3px #0002;display:flex;flex-direction:column}
.cmp .cc h4{margin:0;padding:.6em .9em;background:var(--bg);color:#fff;font-family:Poppins,sans-serif;font-size:1.02em}
.cmp .cc.hl h4{background:var(--gold);color:#111}
.cmp .cc ul{margin:0;padding:.7em .9em .7em 1.8em;line-height:1.32}
.cmp .cc li{margin-bottom:.45em}
.qa{display:grid;grid-template-columns:1fr 340px;gap:22px;height:100%}
.qa .qq{background:var(--bg);color:#fff;border-radius:8px;padding:20px 26px;font-family:Poppins,sans-serif;font-weight:700;font-size:1.55em;line-height:1.25;border-left:8px solid var(--gold)}
.qa .qq small{display:block;color:var(--gold);font-size:.5em;letter-spacing:.1em;margin-bottom:6px}
.qa .aa{background:#fff;border-radius:8px;padding:18px 26px;margin-top:16px;font-size:1.22em;line-height:1.42;box-shadow:0 1px 3px #0002}
.qa .aa small{display:block;color:var(--gold-d);font-weight:700;letter-spacing:.1em;font-size:.62em;margin-bottom:6px}
.qa .nn{display:flex;flex-direction:column;gap:12px}
.qa .nn .st{flex:1;background:#fff;border-top:5px solid var(--gold);border-radius:6px;padding:10px 16px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 1px 3px #0002}
.qa .nn .v{font-family:Poppins,sans-serif;font-weight:700;color:var(--gold-d);line-height:1.1}
.qa .nn .l{font-size:.95em;color:#333;margin-top:3px;line-height:1.2}
.split{display:grid;grid-template-columns:1.15fr .85fr;gap:22px;height:100%}
.split h3{font-family:Poppins,sans-serif;margin:0 0 .5em;font-size:1.2em}
.split ul{padding-left:1.3em;line-height:1.35}
.tl{display:grid;gap:14px;position:relative;padding-top:72px;align-items:stretch}
.tl::before{content:"";position:absolute;left:0;right:0;top:46px;height:4px;background:var(--gold)}
.tl .ti{position:relative;background:#fff;border-radius:6px;padding:.8em .9em;box-shadow:0 1px 3px #0002}
.tl .ti .mk{position:absolute;bottom:calc(100% + 40px);left:0;font-family:Poppins,sans-serif;font-weight:700;font-size:.85em;color:var(--gold-d);background:var(--gold-t);border-radius:99px;padding:.1em .8em;white-space:nowrap}
.tl .ti::before{content:"";position:absolute;top:-38px;left:14px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:4px solid var(--gold)}
.tl .ti h4{font-family:Poppins,sans-serif;margin:0 0 .3em;font-size:1.02em;line-height:1.2}
.tl .ti p{margin:0;line-height:1.3;font-size:.96em}
.map{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;grid-auto-rows:auto;align-content:start}
.map .mq{background:#fff;border-radius:6px;border-left:6px solid var(--gold);padding:.55em .8em;box-shadow:0 1px 3px #0002}
.map .mq b{display:block;font-family:Poppins,sans-serif;font-size:1em;line-height:1.2;margin-bottom:.4em}
.map .mq a.ch{display:flex;gap:.5em;align-items:baseline;font-size:.86em;line-height:1.2;padding:.12em .3em;margin:0 -.3em;border-radius:4px;color:#222}
.map .mq a.ch:hover{background:var(--gold-t)}
.map .mq a.ch i{font-style:normal;font-weight:700;color:#fff;background:var(--bg);border-radius:4px;padding:0 .4em;min-width:2.3em;text-align:center;font-size:.9em;flex:0 0 auto}
/* escuros */
.dk-main{display:flex;flex-direction:column;height:100%;justify-content:center}
.cover .dk{padding:0 70px}
.cover .big{font-family:Poppins,sans-serif;font-weight:700;font-size:70px;line-height:1.05;color:#fff;margin:0}
.cover .big span{color:var(--gold)}
.cover .lead{font-size:23px;color:#ddd;margin:18px 0 0;max-width:820px;line-height:1.35}
.cover .meta{margin-top:32px;font-size:16px;color:#aaa;line-height:1.55}
.cover .btns{display:flex;gap:14px;margin-top:30px}
.cover .btns a{padding:11px 22px;border-radius:6px;border:2px solid var(--gold);color:var(--gold);font-weight:700;font-size:16px;letter-spacing:.03em}
.cover .btns a.p{background:var(--gold);color:#111}
.cover img.bg{position:absolute;right:70px;top:100px;height:260px}
.mcont{display:flex;flex-direction:column;height:100%}.menu-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;flex:1;min-height:0}
.menu-grid .col{background:#fff;border-radius:6px;box-shadow:0 1px 3px #0002;display:flex;flex-direction:column;overflow:hidden}
.menu-grid .col h4{margin:0;background:var(--bg);color:var(--gold);padding:.7em .75em;font-family:Poppins,sans-serif;font-size:1em;line-height:1.2;min-height:5.6em}
.menu-grid .col h4 small{display:block;color:#ccc;font-family:Carlito,Calibri,sans-serif;font-weight:400;font-size:.82em;margin-top:4px}
.menu-grid .col .lk{display:block;padding:.6em .75em;border-bottom:1px solid var(--line);font-size:1.02em;line-height:1.22}
.menu-grid .col .lk:hover{background:var(--gold-t)}
.menu-grid .col .lk b{color:var(--gold-d);display:block;font-size:.8em;letter-spacing:.05em}
.menu-grid .col .lk em{font-style:normal;color:#777;font-size:.82em}
.quick{display:flex;gap:10px;margin-top:12px}
.quick a{flex:1;text-align:center;background:var(--bg);color:var(--gold);font-weight:700;border-radius:6px;padding:.6em .5em;font-size:.95em}
.quick a:hover{background:#2a2410}
.part .dk{padding:0 70px}
.part .rom{font-family:Poppins,sans-serif;font-weight:700;color:var(--gold);font-size:22px;letter-spacing:.14em}
.part .nm{font-family:Poppins,sans-serif;font-weight:700;font-size:54px;line-height:1.08;margin:6px 0 10px}
.part .qq{color:var(--gold);font-size:26px;font-style:italic;margin-bottom:12px}
.part .it{color:#ccc;font-size:19px;line-height:1.4;max-width:900px}
.part .secs{display:grid;gap:12px;margin-top:30px;grid-template-columns:repeat(var(--n),1fr)}
.part .secs a{background:var(--card);border:1px solid #3a3a3a;border-top:4px solid var(--gold);border-radius:6px;padding:14px 16px;display:block}
.part .secs a:hover{background:#262210}
.part .secs b{display:block;color:var(--gold);font-size:13px;letter-spacing:.08em}
.part .secs span{display:block;font-size:17px;line-height:1.2;margin:4px 0 6px;font-weight:700}
.part .secs small{color:#aaa;font-size:13.5px}
.secd .dk{padding:0 50px}
.secd .kk{color:var(--gold);letter-spacing:.1em;font-weight:700;font-size:14px;text-transform:uppercase}
.secd .nm{font-family:Poppins,sans-serif;font-weight:700;font-size:38px;line-height:1.1;margin:6px 0 4px}
.secd .mt{color:#bbb;font-size:16px;margin-bottom:16px}
.secd .lst{display:grid;gap:6px 14px;grid-auto-flow:column;grid-template-rows:repeat(var(--r),auto)}
.secd .lst a{display:flex;gap:10px;align-items:baseline;background:var(--card);border-left:3px solid var(--gold);border-radius:4px;padding:.35em .7em;font-size:15px;line-height:1.2}
.secd .lst a:hover{background:#2c2610}
.secd .lst a i{font-style:normal;color:var(--gold);font-weight:700;min-width:1.7em}
.secd .lst a em{font-style:normal;color:#999;margin-left:auto;font-size:.82em;white-space:nowrap}
/* ---------- impressão / PDF ---------- */
@page{size:1280px 720px;margin:0}
body.print .slide:last-child{break-after:auto;page-break-after:auto}
body.print{background:#fff;height:auto}
body.print #app{display:block;height:auto}
body.print #bar,body.print #stagewrap>.offcanvas{display:none!important}
body.print #stagewrap{display:block;overflow:visible}
body.print #stage{transform:none!important;box-shadow:none;height:auto;width:1280px}
body.print .slide{break-after:page;page-break-after:always;-webkit-print-color-adjust:exact;print-color-adjust:exact}

.slide .content.ctr{display:flex;flex-direction:column}.slide .content.ctr>*{margin:auto 0;flex:0 0 auto}

/* ===== HUB: acrescentos ao app.css (mesma paleta e tipografia) ===== */
.tag-P{background:#6B4FA0}.tag-L{background:#1F7A7A}
.slide .nav .tabs{gap:2px;margin-left:8px}
.slide .nav .tab{font-size:13px;padding:6px 9px}
.slide .nav .tab.ext{margin-left:auto;border-color:var(--gold);color:var(--gold);font-weight:700}
.slide .nav .tab.ext:hover{background:#2a2410;color:#fff}
.slide .nav .menu{font-size:12.5px;padding:6px 11px}
.slide .nav img.logo{height:30px}
.slide .foot{gap:10px;padding:0 20px 0 32px}
.slide .foot .refs{white-space:nowrap;color:var(--gold-d);font-weight:700;font-size:12px}
.slide .foot .refs a{display:inline-block;margin-left:4px;padding:0 6px;border:1px solid var(--gold);border-radius:4px;line-height:17px;background:#fff}
.slide .foot .refs a:hover{background:var(--gold);color:#111}
.slide.dark .foot .refs a{background:transparent;color:var(--gold)}

.offcanvas a.it.ext{color:#ddd}
.offcanvas a.it.ext:hover{background:#262626;color:#fff}
.offcanvas .hint{font-size:.8rem;color:#999;margin:0 0 .5rem}
.offcanvas .fl{display:block;text-align:center;background:#1b1b1b;border:1px solid var(--gold);color:var(--gold);border-radius:5px;padding:.35rem;font-weight:700;font-size:.88rem;margin-bottom:.7rem}

.hcover .big{font-family:Poppins,sans-serif;font-weight:700;font-size:58px;line-height:1.05;color:#fff;margin:0}

.hcover .door.gold{border-color:var(--gold);background:#1b180b}

.hcover .bt2{display:flex;gap:10px;margin-top:auto;padding-top:8px}
.hcover .bt2 a{padding:8px 16px;border:2px solid var(--gold);border-radius:6px;color:var(--gold);font-weight:700;font-size:14.5px}
.hcover .bt2 a.p{background:var(--gold);color:#111}
.hcover .tiles{display:grid;grid-template-columns:repeat(11,1fr);gap:8px;margin-top:16px}
.hcover .tiles a{background:var(--card);border:1px solid #3a3a3a;border-top:3px solid var(--gold);border-radius:5px;padding:7px 4px;text-align:center}
.hcover .tiles a:hover{background:#262210}
.hcover .tiles i{display:block;font-style:normal;color:var(--gold);font-weight:700;font-size:12px}
.hcover .tiles span{font-size:13.5px;font-weight:700;line-height:1.1}
.hcover .meta{margin-top:12px;font-size:13px;color:#999;line-height:1.4}
/* menus */
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:12px;height:calc(100% - 62px)}

.pgrid .pq{padding:.6em .75em;font-size:1.04em;line-height:1.28;flex:1;color:#222}
.pgrid .pf{display:flex;justify-content:space-between;padding:.4em .75em;border-top:1px solid var(--line);font-size:.9em;color:var(--gold-d);font-weight:700}
.quick.sc{flex-wrap:wrap;align-items:center;margin-top:10px}
.quick.sc span{font-weight:700;color:#444;font-size:.95em}
.quick.sc a{flex:0 0 auto;padding:.45em .9em;font-size:.9em}
.quick.sc a.alt,.quick a.alt{background:var(--gold);color:#111}
.quick{flex-wrap:wrap}
.quick a{flex:1 1 auto}
/* abertura do pilar */
.secd .qq2{color:var(--gold);font-size:21px;font-style:italic;margin:2px 0 4px}
.secd .mt{margin-bottom:12px}

.sim{display:flex;flex-direction:column;gap:7px;height:100%;font-size:14px}
.sim-top{display:flex;gap:12px;align-items:stretch;flex:0 0 auto}
.seg{display:flex;flex-direction:column;gap:3px;flex:0 0 150px}
.seg button{flex:1;border:1px solid #bbb;background:#fff;border-radius:5px;font-weight:700;font-size:13.5px;color:#333;padding:0 8px;cursor:pointer;text-align:left}
.seg button:hover{border-color:var(--gold-d)}
.seg button.on{background:var(--gold);border-color:var(--gold);color:#111}
.kps{flex:1;display:grid;gap:8px}
.kps.k4{grid-template-columns:repeat(4,1fr)}.kps.k3{grid-template-columns:repeat(3,1fr)}
.kp{background:#fff;border-top:5px solid var(--gold);border-radius:6px;box-shadow:0 1px 3px #0002;padding:5px 10px;display:flex;flex-direction:column;justify-content:center;min-height:78px}
.kp small{font-size:12.5px;color:#555;font-weight:700;letter-spacing:.02em}
.kp b{font-family:Poppins,sans-serif;font-size:19px;color:var(--gold-d);line-height:1.15}
.kp em{font-style:normal;font-size:12.5px;color:#444;line-height:1.2}
.sim-main{flex:1;min-height:0;display:grid;grid-template-columns:1.02fr 1fr;gap:12px}
.sim-chart{position:relative;background:#fff;border-radius:6px;box-shadow:0 1px 3px #0002;min-height:0;overflow:hidden}
.sim-chart svg{display:block;width:100%;height:100%}
.sim-tbl{min-height:0;overflow:hidden}
.sim-tbl table.sm{height:100%;font-size:13.5px}
.sim-tbl table.sm th{padding:.3em .5em;font-size:12.5px;line-height:1.1}
.sim-tbl table.sm td{padding:0 .5em;vertical-align:middle;line-height:1.1}
.sim-tbl table.sm td.r{text-align:right;font-variant-numeric:tabular-nums}
.sim-tbl table.sm td.pos{color:#1f6b3d;font-weight:700}
.sim-tbl table.sm tr.ret td{background:#DDEFE3!important}
.sim-tbl table.sm tr.pk td{background:var(--gold-t)!important}
.sim-tbl table.sm td.retc{background:#DDEFE3!important}
.sim-tbl table.sm td em{font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#555;margin-left:3px}
.mk{font-size:10.5px;vertical-align:1px}.mk.e{color:#2F7D4F}.mk.o{color:#B58B0A}
.sim-leg{display:flex;gap:14px;align-items:center;justify-content:space-between;font-size:13px;line-height:1.25;flex:0 0 auto;min-height:32px}
.sim-leg .rd{color:#333}.sim-leg .lgd{white-space:nowrap;color:#444}
.sim .degs{flex:0 0 auto;font-size:12.5px;color:#444;border-top:1px dashed #C9C5B6;padding-top:4px;line-height:1.25}
.sim .degs b{color:#8A6D12}
.pgrid{height:calc(100% - 104px)}
.menu-grid .col h4{min-height:7.4em}
.menu-grid .col h4 small{font-size:.78em}
.quick.sc a{padding:.35em .8em}

/* barra externa removida: a barra do slide assume o topo */
.slide .nav .tab.home{color:var(--gold);font-weight:700}
.slide .nav .fsb{background:transparent;border:1px solid #555;color:#ddd;border-radius:5px;font-size:15px;line-height:1;padding:5px 9px;cursor:pointer}
.slide .nav .fsb:hover{border-color:var(--gold);color:var(--gold)}
.slide .nav .menu{cursor:pointer}

péis; comunicar ANPD e titulares em até 3 dias úteis (Res. CD/ANPD 15/2024)","Dossiê + LEI"],["Dependência do desenvolvedor","Documentação, repositório compartilhado e horas sob demanda","Dossiê"],["Vaga em curso durante a queda","Prazos de 60 dias da vaga e da garantia pausam durante a indisponibilidade; candidato e empresa são avisados","PROPOSTA"]],"hl":[],"first":true,"note":"Regra de prazos pausados precisa entrar no termo de uso (CONFIRMAR com advogado).","widths":[2.4,6.4,1.5]},"src":"Dossiê pp. 50, 114; Res. CD/ANPD 15/2024; proposta","tag":"P","kind":"slide","no":18,"k":8,"kn":11},{"id":"tec-acc1","part":"tec","sec":"tec","layout":"cards","title":"Acessibilidade 1/2 · Base legal e o que ajustar na tela","sub":"Recursos que podem ser adotados no portal do candidato e no painel da empresa","data":{"items":[["Base legal e padrão","A Lei Brasileira de Inclusão (13.146/2015, art. 63) exige acessibilidade nos sites de empresas com sede ou representação comercial no País. Padrão técnico: ABNT NBR 17225:2025, alinhada à WCAG 2.2. Meta: nível AA.","L"],["Teclado e leitor de tela","Tudo operável só com teclado, foco visível, ordem lógica de leitura, rótulos em todos os campos e testes com leitor de tela (NVDA e VoiceOver).","P"],["Leitura e cor","Contraste mínimo de 4,5:1, zoom de 200% sem perder conteúdo, alvos de toque de pelo menos 24×24 px (WCAG 2.2) e nada que dependa só da cor: o semáforo do IMU leva texto.","P"],["Formulários e login sem barreira","Mensagens de erro claras, não pedir o mesmo dado duas vezes, login sem enigma ou teste cognitivo (WCAG 2.2) e tempo suficiente para responder.","P"]],"cols":2,"note":"Padrão adotado como meta da equipe; nada disso foi testado no protótipo."},"src":"Lei 13.146/2015; WCAG 2.2 (W3C, 2023); ABNT NBR 17225:2025","tag":null,"kind":"slide","no":19,"k":9,"kn":11},{"id":"tec-acc2","part":"tec","sec":"tec","layout":"cards","title":"Acessibilidade 2/2 · Conteúdo, vagas inclusivas e prova","sub":"Acessibilidade também de quem contrata e de quem é avaliado","data":{"items":[["Linguagem simples","Parecer explicado em frases curtas, resumo antes do detalhe e glossário dos critérios: ajuda quem tem dificuldade de leitura e todos os outros.","P"],["Vídeos e Libras","Legendas e transcrição nos vídeos de demonstração, texto alternativo nas imagens e opção de tradutor de Libras (VLibras, do governo federal).","P"],["Vaga inclusiva","Campo opcional para adaptações e alerta contra critérios discriminatórios (já planejado). Empresas com 100 ou mais empregados têm cota de 2% a 5% para pessoas com deficiência (Lei 8.213/1991, art. 93).","L"],["Provar e manter","Declaração de acessibilidade com canal para relatar barreira, teste automático a cada versão e revisão anual junto do teste de segurança.","P"]],"cols":2,"note":"Dado sensível (como deficiência) só entra se o candidato informar e consentir: ver pilar LGPD."},"src":"Lei 8.213/1991; proposta da gaveta","tag":null,"kind":"slide","no":20,"k":10,"kn":11},{"id":"tec-accPlano","part":"tec","sec":"tec","layout":"steps","title":"Acessibilidade: plano em três fases","sub":"Proposta de sequência; custos só estimados com a hora do desenvolvedor do dossiê","data":{"items":[["1 · Antes do piloto","Contraste, rótulos, foco e teclado no design; teste automático. Cabe nas 80 h de desenvolvimento previstas."],["2 · No piloto","Teste manual com leitor de tela e com 2 ou 3 usuários com deficiência; declaração de acessibilidade e canal de contato."],["3 · Na operação","Revisão a cada versão e auditoria anual. Cada 10 h extras de desenvolvimento custam R$ 1.200 (R$ 120/h)."]],"note":null},"src":"Proposta da gaveta; hora de R$ 120 (Dossiê p. 48)","tag":"P","kind":"slide","no":21,"k":11,"kn":11},{"id":"S-fin","kind":"sec","part":"fin","sec":"fin","title":"Dados financeiros","no":22},{"id":"fin-1","part":"fin","sec":"fin","layout":"stats","title":"Viabilidade em quatro números","sub":"Cobrança por contratação, custos fixos em degraus, investimento em etapas e marketing ço, não estima demanda","Ninguém respondeu sobre preço por contratação: os três reagiram a \"R$ 200 a 400 por mês\"; R$ 390 e R$ 1.290 são inferência a testar","Transcrição automática com erros conhecidos; o \"6%\" foi dito com \"se não me engano\"","Tempo de contratação não foi respondido","Uso de nomes no pitch depende de autorização"],"hl":true},{"h":"Próximas validações (depois da competição)","items":["Piloto de 2 meses sem cobrança com 3 a 5 empresas (incluindo um perfil sazonal)","Teste de preço por vaga: oferecer R$ 390 e R$ 1.290 ao fim do piloto (meta de 40% de conversão)","Taxa real de reabertura em 90 dias (modelo usa 20%)","Pergunta de tempo de contratação na entrada de cada vaga","Conversa com 2 redes de negócios como canal"],"hl":false}],"note":null},"src":"Dossiê p. 61","tag":null,"kind":"slide","no":52,"k":9,"kn":11},{"id":"mer-10","part":"mer","sec":"mer","layout":"steps","title":"Estratégia de entrada em quatro movimentos","sub":null,"data":{"items":[["Entrar pelo candidato","Uso gratuito para estudantes e egressos de cursos técnicos. Prova: 5.000 candidatos em 12 meses."],["Piloto sem cobrança","2 meses com 3 a 5 empresas indicadas. Prova: vagas fechadas, tempo até a contratação, aceite do preço (meta 40%)."],["Vaga com garantia","A primeira compra é uma vaga; a consultora entra para quem não tem RH. Prova: recompra ≥ 40% em 12 meses; 35% com consultora."],["Confiança como diferencial","Parecer explicado, decisão registrada, auditoria amostral. Prova: 100% das reprovações justificadas; reabertura ≤ 20%."]],"note":"Metas da equipe: ESTIMATIVA, a medir no piloto depois da competição."},"src":"Dossiê p. 12","tag":null,"kind":"slide","no":53,"k":10,"kn":11},{"id":"mer-11","part":"mer","sec":"mer","layout":"compare","title":"Segmentos iniciais e canais","sub":null,"data":{"cols":[{"h":"Segmentos iniciais","items":["Pequenas empresas de comércio e distribuição que contratam poucas vezes por ano (perfil da distribuidora e da loja de pisos ouvidas)","Emp ,"Botão “excluir minha conta e meus dados”; sai do banco de candidatos","Exceções de guarda legal (art. 16)"],["Portabilidade","Exportar currículo e pareceres em formato aberto","Conforme regulamentação da ANPD"],["Informação sobre compartilhamento","Lista de quem recebe dados: empresa da vaga, provedor de IA, e-mail e nuvem","Aviso de privacidade"],["Revisão de decisão automatizada (art. 20)","Botão “pedir revisão”; pessoa responde com justificativa por critério","Meta do dossiê: revisão em até 10 dias úteis"]],"hl":[],"first":true,"note":null,"widths":[2.6,4.4,3.2]},"src":"Lei 13.709/2018, arts. 16, 18, 19 e 20; Dossiê p. 33","tag":"P","kind":"slide","no":58,"k":3,"kn":7},{"id":"lgpd-cand","part":"lgpd","sec":"lgpd","layout":"steps","title":"Plano de ações 1/2 · Evitar problemas com candidatos","sub":"Oito ações curtas, na ordem de implantação antes do piloto","data":{"items":[["Mapear os dados","Inventário: que dado, para quê, onde fica, quem acessa e por quanto tempo (art. 37)."],["Aviso e consentimentos","Aviso curto com finalidade e direitos; consentimento do banco de candidatos separado do da candidatura."],["Coletar menos","IA sem nome, CPF ou contato; sem foto, endereço, idade, gênero ou raça como critério."],["Decisão humana","Parecer explicado, justificativa em toda reprovação e botão de pedir revisão."],["Prazo de guarda","Definir retenção por vaga e do banco; apagar ou anonimizar ao fim (prazo a validar com advogado)."],["Segurança","Criptografia, acesso por perfil, registro de acessos, backup e teste de segurança (art. 46)."],["Encarregado e canal","DPO com e-mail público; resposta em até 15 dias; relatório mensal de pedidos."],["Incidente","Plano com papéis; avisar ANPD e titulares em até 3 dias úteis; registrar todo incidente."]],"note":null},"src":"Lei 13.709/2018; Res. CD/ANPD 15/2024; Dossiê pp. 49–50","tag":"P","kind":"slide","no":59,"k":4,"kn":7},{"id":"lgpd-pj","part":"lgpd","sec":"lgpd","layout":"steps","title":"Plano de ações 2/2 · Evitar problemas com empresas (pessoa jurídica)","sub":"A empresa é parte da conformidade: o contrato e a capacitação dividem as responsabilidades","data":{"items":[["Contrato com cláusulas de dados","Define papéis (controlador e operadora), finalidade, instruções e fim do contrato (art. 39)."],["Acordo de tratamento","O operador segue instruções; responde solidariamente se descumprir a lei (art. 42, § 1º)."],["Capacitação obrigatória","Módulo M4 “LGPD e não discriminação” (20 min, teste ≥ 80%) antes de ver candidatos."],["Critérios proibidos","Alerta na publicação (idade, gênero, raça, foto); justificativa em toda reprovação; reincidência pode suspender o uso."],["Fornecedores e exterior","Lista de fornecedores (nuvem, IA, e-mail); transferência internacional só com cláusulas-padrão da ANPD (Res. 19/2024) ou outro mecanismo do art. 33."],["Incidente: quem avisa quem","A empresa, como controladora, tem 3 dias úteis; o BARD RH avisa a empresa de imediato (prazo interno a fixar no contrato)."],["Devolução e eliminação","Ao fim do contrato ou da vaga, devolver ou eliminar dados de candidatos, com relatório."],["Evidências","Relatório da vaga e trilha de auditoria exportáveis como prova de conformidade da empresa."]],"note":null},"src":"Lei 13.709/2018, arts. 33, 39, 42; Res. CD/ANPD 19/2024; Dossiê pp. 33–35","tag":"P","kind":"slide","no":60,"k":5,"kn":7},{"id":"lgpd-riscos","part":"lgpd","sec":"lgpd","layout":"table","title":"Riscos, consequências e prevenção","sub":null,"data":{"cols":["Risco","Consequência possível","Prevenção no BARD RH"],"rows":[["Vazamento de currículos","Comunicação à ANPD e aos titulares; multa de até 2% do faturamento; indenização","Minimização, criptografia, teste de segurança, plano de incidentes"],["Discriminação por critério ou algoritmo","Lei 9.029/1995; auditoria da ANPD (art. 20, § 2º); dano moral","Lista de critérios proibidos, decisão humana, auditoria de viés trimestral"],["Reprovar sem explicar","Pedido de revisão e queixa do titular","Parecer por critério e justificativa registrada"],["Dado sensível sem base","Tratamento irregular (art. 11)","Não coletar por padrão; consentimento específico se for opcional"],["Transferência internacional sem mecanismo","Infração ao art. 33 e à Res. 19/2024","Mapear fornecedores; cláusulas-padrão; preferir região no Brasil quando houver"],["Atuar sem contrato de operadora","Responsabilidade solidária (art. 42, § 1º)","Contrato com instruções claras"]],"hl":[],"first":true,"note":"PL 2338/2023 (marco da IA) segue em tramitação na Câmara e trata recrutamento como alto risco: já alinhado a decisão humana e trilha. Conferir andamento antes da banca.","widths":[2.5,3.6,3.8]},"src":"Lei 13.709/2018; Lei 9.029/1995; Res. CD/ANPD 19/2024","tag":"L","kind":"slide","no":61,"k":6,"kn":7},{"id":"lgpd-art20","part":"lgpd","sec":"lgpd","layout":"explain","title":"Decisão automatizada e IA em recrutamento (art. 20)","sub":"Resumo em quatro blocos: o que diz a lei, palavras-chave, decisões e exemplos","data":{"what":"O art. 20 permite ao candidato pedir revisão de decisões tomadas só por tratamento automatizado e saber os critérios usados. A lei não exige que a revisão seja humana; o BARD RH adota a decisão humana como escolha de desenho. Isso reduz risco hoje e se alinha ao PL 2338/2023, que trata recrutamento como alto risco.","keys":["art. 20","decisão humana","parecer por critério","pedido de revisão","trilha de auditoria","PL 2338/2023","alto risco"],"decisions":[["Nenhuma reprovação automática","A IA explica e sugere; uma pessoa decide, com ator, data e motivo registrados."],["Justificativa por critério","Toda reprovação tem justificativa escrita ligada a critérios."],["Revisão em até 10 dias úteis","Meta do dossiê (D5); o pedido e a resposta ficam na trilha."],["Acompanhar o marco da IA","PL 2338/2023 na Câmara; parecer jurídico sobre alto risco em currículos (CONFIRMAR)."]],"examples":[["Parecer de 7% de aderência","O candidato vê os critérios e as lacunas, recebe indicação de ["Temporada","Empresa de eventos com 12 temporários: 2 pacotes + 2 vagas = 12 unidades por R$ 3.960 (R$ 330 por vaga). Reposição de faltas em até 2 dias úteis (meta)."],["Sob demanda","Quatro serviços de R$ 1.920 a R$ 10.240: diagnóstico (12 h), estruturação (24 h, R$ 3.840), trilhas (40 h) e projeto completo (64 h em 8 semanas). 50% no aceite e 50% na entrega."]],"cols":2,"note":"Unidades não usadas expiram em 12 meses; devolução ou prorrogação: CONFIRMAR no termo."},"src":"Dossiê pp. 20–21","tag":"H","kind":"slide","no":88,"k":5,"kn":10},{"id":"pac-6","part":"pac","sec":"pac","layout":"table","title":"Os três planos do candidato","sub":"Plus e Premium são planejados, dependem do teste manual do estudo 02 e estão fora do caso-base. O plano pago não altera o parecer nem a decisão da empresa","data":{"cols":["","Gratuito","Plus","Premium"],"rows":[["Preço","R$ 0","R$ 29,90 por mês","R$ 69,90 por mês"],["Parecer explicado e resposta","Sim","Sim","Sim"],["Diagnóstico das lacunas","Resumo (3 lacunas) e até 3 cursos gratuitos","Completo","Completo"],["Roadmap validado por profissional","—","30 dias","30, 60 ou 90 dias"],["Trilha gamificada","—","1 trilha de 30 h","Trilhas de 30, 60 e 90 h"],["Acompanhamento humano","—","1 ajuste a pedido","Ponto mensal de 15 min"],["Revisão de currículo / simulação de entrevista / certificado","—","—","Sim (até 4 simulações por mês)"]],"hl":[0],"first":true,"note":null,"widths":null},"src":"Dossiê p. 17","tag":"H","kind":"slide","no":89,"k":6,"kn":10},{"id":"pac-7","part":"pac","sec":"pac","layout":"chart","title":"Economia do candidato por ciclo médio: o que sobra","sub":"A validação humana consome 32% da receita do Plus e 35% do Premium, mais que qualquer outro custo. A IA é pequena","data":{"kind":"stack","cats":["Plus: R$ 53,82 (1,8 mês)","Premium: R$ 209,70 (3,0 meses)"],"series":[["Imposto",[8.34,32.5]],["Gateway",[3.14,8.95]],["IA",[0.62,13.21]],["Validação humana",[17.33,73.33]],["Suporte",[7.2,18.0]],["Arrependimento (5%)",[1.5,3.5]],["Margem",[15.69,60.21]]],"fmt":"R$","note":"Margem de R$ 15,69 (29%) e R$ 60,21 (29%). No estresse (imposto 18%, gateway 5%, IA +50%, validador R$ 110): R$ 7,99 (15%) e R$ 19,33 (9%).","side":null},"src":"Dossiê pp. 71–72","tag":"E","kind":"slide","no":90,"k":7,"kn":10},{"id":"pac-8","part":"pac","sec":"pac","layout":"cards","title":"Conclusões que a equipe leva para a banca","sub":null,"data":{"items":[["Quem produz as trilhas e a que custo?","A IA propõe o roadmap e rascunhos; um arquiteto de trilhas (PJ, R$ 100/h) cria 84 módulos em 248 h (R$ 24.800); um validador (R$ 80/h) revisa cada roadmap pago antes de chegar ao candidato."],["Planos pagos não se sustentam sozinhos","Cada Plus deixa R$ 15,69 e cada Premium R$ 60,21 depois da validação humana. No realista, o lado candidato não se paga em 36 meses (−R$ 56.128).","E"],["Testar antes de construir","Etapa 0 manual (PDF, Pix, validação humana) custa ≈ R$ 10.560 e mede conversão, permanência e minutos de validação."],["Caso-base sem receita de candidato","O Gratuito está em todas as projeções; Plus e Premium são opção e entram no estudo 09 como cenário à parte."]],"cols":2,"note":null},"src":"Dossiê p. 65","tag":null,"kind":"slide","no":91,"k":8,"kn":10},{"id":"pac-9","part":"pac","sec":"pac","layout":"table","title":"Regras de cobrança, prazos e contrato","sub":null,"data":{"cols":["Tema","Regra proposta","Estado"],"rows":[["Cobrança","Por vaga, no aceite, por Pix ou cartão; sem mensalidade","Hipótese a testar no piloto"],["Nota fiscal","Nota fiscal de serviço emitida no pagamento","CONFIRMAR com contador"],["Vaga ativa","60 dias a partir da publicação; prorrogação não definida","Hipótese"],["Garantia de reabertura","Uma vez, em até 90 dias da admissão, mesmo cargo e faixa; não vale para justa causa nem mudança de escopo","CONFIRMAR"],["Reembolso","Nenhum após a publicação; antes, devolução integral","CONFIRMAR com advogado"],["Dados e IA","Dados usados só para a vaga, com consentimento; decisão final sempre humana","LGPD, estudo 03"],["Critérios discriminatórios","Proibidos; alerta antes da publicação; reincidência pode suspender o uso","Estudo 13"],["Resultado","Sem promessa de contratação ou de redução de rotatividade","Regra do pitch"]],"hl":[],"first":true,"note":null,"widths":[2.6,6.6,3.0]},"src":"Dossiê p. 21","tag":null,"kind":"slide","no":92,"k":9,"kn":10},{"id":"pac-10","part":"pac","sec":"pac","layout":"table","title":"Cinco cenários de ponta a ponta","sub":"Cronogramas dia a dia no manual da jornada (Parte II). Prazos são hipóteses a medir no piloto","data":{"cols":["Cenário","Produto","Receita","Margem","Horas de consultora","Tempo até a decisão"],"rows":[["1. Distribuidora, 1 assistente","Vaga com plataforma","R$ 390","R$ 275 (70%)","0","≈ 21 dias"],["2. Loja de pisos, 1 gerente","Vaga com consultora","R$ 1.290","R$ 389 (30%)","7","≈ 28 dias"],["3. Eventos, 12 temporários","2 pacotes + 2 vagas","R$ 3.960","R$ 2.715 (69%)","0","≈ 15 dias"],["4. Reabertura pela garantia","Garantia","—","custo de R$ 37 a R$ 357","0 ou 4","≈ 14 dias"],["5. Cargos e salários","Projeto sob demanda","R$ 3.840","R$ 1.228 (32%)","24","4 semanas"]],"hl":[],"first":true,"note":"Reposição de faltas no contrato temporário precisa de definição própria (CONFIRMAR). Referência de agência para 12 contratações permanentes: R$ 19.452, só para dimensionar a economia.","widths":[3.2,2.6,1.4,2.2,1.4,1.4]},"src":"Dossiê pp. 74–79","tag":"H","kind":"slide","no":93,"k":10,"kn":10},{"id":"S-wl","kind":"sec","part":"wl","sec":"wl","title":"White label","no":94},{"id":"wl-1","part":"wl","sec":"wl","layout":"explain","title":"White label: explicação rápida","sub":"Resumo em quatro blocos: o que é, palavras-chave, decisões e exemplos","data":{"what":"White label é licenciar a plataforma do BARD RH para outra organização usar com a própria marca (logo, cores, domínio). Seria um produto à parte, com contrato próprio: o BARD RH vira fornecedor de tecnologia e o licenciado fica com a relação com candidatos e empresas. No dossiê é a camada 5: oportunidade, não premissa, fora do caso-base.","keys":["licença mensal","multiempresa","marca do licenciado","controlador × operadora","titularidade do código","cartas de intenção","não licenciar a concorrente direto","camada 5"],"decisions":[["Fora do caso-base e do pitch","É oportunidade e contingência; a resposta à banca é curta e honesta."],["Só iniciar com 3 condições","2 cartas de intenção a R$ 1.490 ou mais, advogado contratado e titularidade do código definida."],["A quem licenciar","Escolas e cursos de RH, associações comerciais e entidades que não concorrem. Nunca a concorrentes diretos enquanto a plataforma for o diferencial."],["Quanto cobrar","Mínimo de ≈ R$ 1.515 por mês para 30% de margem. Hipóteses: R$ 1.490 e R$ 1.990 por mês + R$ 3.500 de implantação."],["Contrato","Licença + acordo de tratamento de dados: licenciado controlador, BARD RH operadora; decisão humana como cláusula."]],"examples":[["Exemplo 1 · Associação comercial","Licença de R$ 1.490: margem de R$ 434 (29%), ≈ 1,4 vaga do mix. Com 3 licenciados, os R$ 13.100 de desenvolvimento se pagam em 10 meses."],["Exemplo 2 · Duas licenças de R$ 1.990","Margem de R$ 842 cada (42%): o investimento volta em 8 meses."],["Exemplo 3 · No realista","Desenvolvimento pago no mês 12, 1ª licença no mês 18, 4 licenciados no mês 36. O capital volta no mês 32 (e não 34) e o caixa do mês 60 vai de R$ 91.874 a R$ 151.852."]],"note":"Todos os valores são hipótese: nenhuma agência ou entidade foi consultada."},"src":"Dossiê pp. 43–44, 118","tag":"H","kind":"slide","no":95,"k":1,"kn":6},{"id":"wl-2","part":"wl","sec":"wl","layout":"table","title":"Três opções de white label","sub":null,"data":{"cols":["Opção","Quem usaria","Avaliação"],"rows":[["1. Não licenciar (caso-base)","—","Mantém o diferencial e a identidade de agência de RH com plataforma"],["2. Licenciar a quem não concorre","Escolas e cursos de RH, associações comerciais, entidades (hipótese; nenhum contato feito)","Possível depois de validar o negócio principal; produto à parte, com contrato próprio"],["3. Licenciar a concorrentes diretos","Agências e consultorias de RH","NÃO recomendado: o diferencial deixa de existir, há conflito de interesse e dependência de quem concorre"]],"hl":[0],"first":true,"note":null,"widths":[3.0,4.6,4.6]},"src":"Dossiê p. 43","tag":null,"kind":"slide","no":96,"k":2,"kn":6},{"id":"wl-3","part":"wl","sec":"wl","layout":"cards","title":"O que seria preciso construir","sub":null,"data":{"items":[["Multiempresa","Isolamento de dados entre licenciados, marca (logo, cores, domínio), painel do licenciado e controle de acesso."],["Operação","Suporte de 2º nível, canal de incidentes e SLA."],["Jurídico e LGPD","Contrato de licença e acordo de tratamento de dados: licenciado é controlador e BARD RH, operadora (LGPD arts. 42 e 43, responsabilidade solidária). CONFIRMAR com advogado."],["IA e propriedade intelectual","Regras de decisão humana no contrato; PL 2338/2023 pode criar deveres a fornecedores. Titularidade do código a confirmar (protótipo gerado com IA e revisado pelo docente de TI)."]],"cols":2,"note":null},"src":"Dossiê p. 43","tag":null,"kind":"slide","no":97,"k":3,"kn":6},{"id":"wl-4","part":"wl","sec":"wl","layout":"table","title":"Números por licenciado","sub":"Investimento único R$ 13.100 (desenvolvimento multiempresa 80 h × R$ 120 = R$ 9.600 + jurídico R$ 3.500). Custo mensal por licenciado R$ 780 (infra R$ 150, suporte R$ 480, rateio R$ 150)","data":{"cols":["Mensalidade (hipótese)","Margem por licenciado/mês","Margem %","Equivale a (vagas do mix)","Retorno: 1 | 2 | 3 | 5 licenciados"],"rows":[["R$ 990","R$ 27","3%","0,1","> 60 meses em todos"],["R$ 1.490","R$ 434","29%","1,4","30 | 15 | 10 | 6 meses"],["R$ 1.990","R$ 842","42%","2,7","16 | 8 | 5 | 3 meses"]],"hl":[1],"first":true,"note":"Preço mínimo para 30% de margem: ≈ R$ 1.515 por mês. Todos os valores são ESTIMATIVA; não há orçamento nem cliente. O Anexo A (v6) traz a leitura atualizada do white label.","widths":[2.4,2.6,1.4,2.6,3.2]},"src":"Dossiê p. 44","tag":"E","kind":"slide","no":98,"k":4,"kn":6},{"id":"wl-5","part":"wl","sec":"wl","layout":"table","title":"Efeito por cenário (Anexo A.3)","sub":"Premissas (hipótese; nenhuma agência consultada): licença R$ 1.490 (boutique) e R$ 1.990 (agência), média R$ 1.690; implantação R$ 3.500; custo R$ 780 por licenciado; CAC R$ 2.500; saída 15% a.a.; desenvolvimento R$ 13.100, 3 meses antes","data":{"cols":["Cenário","Dev. pago em","1ª licença","Licenciados (m36, 48, 60, 84)","Caixa no mês 60","Capital recuperado"],"rows":[["Pessimista (contingência)","mês 10","mês 31","1, 2, 2 e 2","R$ 2.252 → R$ 6.322","mês 59 → 58"],["Realista","mês 12","mês 18","4, 5, 6 e 6","R$ 91.874 → R$ 151.852","mês 34 → 32"],["Otimista","mês 10","mês 14","8, 10, 12 e 12","R$ 350.941 → R$ 486.579","mês 26 → 25"]],"hl":[],"first":true,"note":"Só começa com 2 cartas de intenção a R$ 1.490+, advogado contratado e titularidade do código definida. Melhora modesta no pessimista (TIR em 10 anos de 22,3% para 25,4%). A posição do estudo 12 vale: não se licencia a concorrentes.","widths":[2.6,1.4,1.4,2.6,2.8,1.6]},"src":"Dossiê p. 118","tag":"H","kind":"slide","no":99,"k":5,"kn":6},{"id":"wl-dec","part":"wl","sec":"wl","layout":"cards","title":"Decisões e condições para começar","sub":null,"data":{"items":[["Condições para iniciar","2 cartas de intenção a R$ 1.490 ou mais, advogado contratado e titularidade do código definida (protótipo gerado com IA e revisado pelo docente de TI).","C"],["Quem pode ser licenciado","Quem não concorre: escolas e cursos de RH, associações, entidades. O Anexo A cita faixas “boutique” e “agência”: definir no contrato o que é concorrente direto.","C"],["Contrato e LGPD","Licença e acordo de tratamento; licenciado controlador e BARD RH operadora (responsabilidade solidária, arts. 42 e 43). PL 2338/2023 pode criar deveres ao fornecedor de IA.","C"],["O que construir","Multiempresa (80 h × R$ 120 = R$ 9.600) + jurídico R$ 3.500 = R$ 13.100; suporte de 2º nível e SLA.","E"]],"cols":2,"note":"O estudo 12 (v2) sugeria reavaliar só a partir do mês 24; o Anexo A (v6) simula desenvolvimento no mês 10 a 12 se as 3 condições existirem."},"src":"Dossiê pp. 43–44, 118","tag":null,"kind":"slide","no":100,"k":6,"kn":6},{"id":"S-sus","kind":"sec","part":"sus","sec":"sus","title":"Sustentabilidade e ODS","no":101},{"id":"sus-1","part":"sus","sec":"sus","layout":"explain","title":"Sustentabilidade no BARD RH: explicação rápida","sub":"Resumo em quatro blocos: o que é, palavras-chave, decisões e exemplos","data":{"what":"Aqui sustentabilidade tem três dimensões. Social: o que muda para candidatos e empresas, organizado em três ODS (8, 10 e 4) com seis indicadores. Econômica: um negócio que cresce em degraus e se paga, para durar. Ambiental: o projeto é digital, o impacto direto é baixo e ainda não foi medido; o dossiê manda declarar isso sem exagero.","keys":["ODS 8 · 10 · 4","dois indicadores por ODS","linha de base","semáforo","resultado × atividade","“ODS washing”","impacto digital não medido","dados agregados"],"decisions":[["Medir o que a plataforma já registra","Nenhum indicador sem fonte de dados; a linha de base vem do piloto, antes de prometer melhoria."],["Resultado, não só atividade","Separar o que mudou para as pessoas do que a equipe fez."],["Meta vira compromisso externo só após 90 dias","Até lá é meta interna da equipe, sem medição."],["Ambiental sem exagero","Impacto direto baixo por ser digital, não medido; não prometer “neutro em carbono”."],["Relato semestral de uma página","Com método, limites e dados agregados: nenhum candidato é exposto."]],"examples":[["Exemplo 1 · ODS 8 (trabalho decente)","O candidato recebe parecer em até 5 dias úteis; meta de 90% no 1º ano, a medir no piloto. Hoje 77% dos profissionais já ficaram sem resposta depois de uma entrevista (Convenia, 2025, n = 1.211)."],["Exemplo 2 · ODS 10 (menos desigualdades)","Toda reprovação sai com justificativa escrita por uma pessoa, critérios discriminatórios (como idade ou sexo) são vetados e 10% dos pareceres passam por auditoria amostral todo mês."],["Exemplo 3 · ODS 4 (educação de qualidade)","Quem é reprovado recebe indicação de cursos gratuitos de terceiros para fechar as lacunas do parecer. Meta: 20% abrem a indicação e 10% voltam a se candidatar (hipóteses)."]],"note":"Nada foi medido: o protótipo roda em simulação e nenhuma empresa comprou. As metas são da equipe."},"src":"Dossiê pp. 53–54; Convenia (2025)","tag":"H","kind":"slide","no":102,"k":1,"kn":12},{"id":"sus-2","part":"sus","sec":"sus","layout":"stats","title":"Sustentabilidade em quatro números","sub":"O social está desenhado e com meta; o ambiental não foi medido","data":{"items":[["3 ODS","no dossiê: 8, 10 e 4, com as metas oficiais 8.5, 8.6, 10.2, 10.3 e 4.4","V"],["6 indicadores","dois por ODS, cada um com fórmula, fonte de dados, meta de 12 meses, responsável e frequência","H"],["90 dias","de medição antes de uma meta virar compromisso externo","H"],["mês 34","o capital volta no cenário realista: o negócio precisa se pagar para o impacto social durar","R"]],"note":null},"src":"Dossiê pp. 53–54, 100","tag":null,"kind":"slide","no":103,"k":2,"kn":12},{"id":"sus-dim","part":"sus","sec":"sus","layout":"cards","title":"Três dimensões, três respostas","sub":"O dossiê detalha a dimensão social; a econômica vem do estudo de viabilidade; a ambiental só declara o limite","data":{"items":[["Social","ODS 8, 10 e 4. Candidato grátis, resposta para todos, parecer explicado, decisão humana com justificativa e cursos gratuitos de terceiros no 1º ano. Tudo com indicador, fonte e responsável.","H"],["Econômica","Crescer em degraus. Custo fixo, investimento e marketing só sobem quando o volume de vagas sustenta o degrau seguinte. Investimento de R$ 25.403, equilíbrio de 8 a ≈ 25 vagas pagas por mês e capital de volta no mês 34 (realista). O pessimista só volta no mês 59: é cenário de parada.","R"],["Ambiental","Digital, sem exagero. Impacto direto baixo por ser um serviço digital, mas não medido. Já ajudam: limite de IA por vaga e cache, retenção e descarte de dados por vaga e infraestrutura que cresce só com o volume.","E"]],"cols":3,"note":"Os números econômicos são hipóteses da equipe: nenhuma venda foi feita e o BARD RH não opera durante a competição."},"src":"Dossiê pp. 53–54, 100, 114","tag":null,"kind":"slide","no":104,"k":3,"kn":12},{"id":"sus-ods","part":"sus","sec":"sus","layout":"cards","title":"ODS 8, 10 e 4: metas oficiais e o que o BARD RH entrega","sub":"Dois indicadores por ODS, com fórmula, fonte, meta, responsável e frequência. Todas as metas são da equipe, sem medição","data":{"items":[["ODS 8 · Trabalho decente","Metas 8.5 (emprego pleno e decente) e 8.6 (menos jovens sem emprego, estudo ou formação). Resposta a cada candidatura e tempo de contratação menor; foco em estudantes e egressos de cursos técnicos."],["ODS 10 · Menos desigualdades","Metas 10.2 (inclusão) e 10.3 (igualdade de oportunidades e fim de práticas discriminatórias). Critérios explícitos, justificativa humana em toda reprovação, lista de critérios proibidos e auditoria amostral."],["ODS 4 · Educação de qualidade","Meta 4.4 (competências para o trabalho). Diagnóstico de lacunas com cursos gratuitos de terceiros (ano 1); trilhas validadas (Plus e Premium) só depois do piloto e do teste manual."]],"cols":3,"note":null},"src":"Dossiê p. 53","tag":null,"kind":"slide","no":105,"k":4,"kn":12},{"id":"sus-jorn","part":"sus","sec":"sus","layout":"steps","title":"Na prática: a jornada de uma candidata e os ODS que ela toca","sub":"Um fluxo só liga o dia a dia da plataforma às metas da Agenda 2030","data":{"items":[["Candidata-se de graça","ODS 8 e 10: acesso sem custo e vaga com critérios explícitos, sem exigência discriminatória."],["Recebe parecer em 5 dias úteis","ODS 8: resposta a todos (meta de 90%); tempo até a contratação medido por tipo de vaga."],["Decisão humana e justificada","ODS 10: toda reprovação tem justificativa de uma pessoa, com direito de pedir revisão (LGPD, art. 20)."],["Indicação de cursos gratuitos","ODS 4: as lacunas do parecer viram cursos gratuitos de terceiros; trilhas pagas só depois do piloto."],["Painel de ODS","Seis indicadores em série mensal, semáforo e relato semestral de uma página com método e limites."]],"note":"O que cada etapa produz já é registrado pela plataforma (logs); o painel de ODS entra no mês 3."},"src":"Dossiê pp. 53–54; LGPD art. 20","tag":"H","kind":"slide","no":106,"k":5,"kn":12},{"id":"sus-ind","part":"sus","sec":"sus","layout":"table","title":"Seis indicadores e metas de 12 meses","sub":null,"data":{"cols":["ODS","Indicador","Meta 12 meses","Linha de base"],"rows":[["8","Parecer em até 5 dias úteis (log de etapas)","90%","A medir no piloto"],["8","Tempo até a contratação (painel de vagas)","Abaixo da linha de base (mercado ≈ 40 dias, indicativo)","A medir no piloto"],["10","Reprovações com justificativa humana (trilha de auditoria)","100% (regra do sistema)","100% em simulação"],["10","Candidaturas com decisão comunicada (log de comunicação)","100%","A medir no piloto"],["4","Reprovados que acessam a indicação de formação (log)","20% no 1º ano","A medir (hipótese)"],["4","Recandidatura após formação","10% no 1º ano","A medir (hipótese)"]],"hl":[],"first":true,"note":"Mudança †: \"500 trilhas concluídas\" saiu porque as trilhas pagas foram suspensas no ano 1 (estudo 02); a meta de 20% foi mantida, ligada à indicação de cursos gratuitos.","widths":[0.9,5.4,3.6,2.3]},"src":"Dossiê p. 53","tag":"H","kind":"slide","no":107,"k":6,"kn":12},{"id":"sus-amb","part":"sus","sec":"sus","layout":"compare","title":"Ambiental: o que se pode dizer sem exagero","sub":"Duas colunas vêm do dossiê e das decisões do projeto; a terceira é proposta para a equipe decidir","data":{"cols":[{"h":"O que o dossiê diz","items":["Impacto direto baixo por ser digital","Não foi medido","Regra: declarar sem exagero","Risco previsto de “ODS washing”: relatório com método e limites"],"hl":true},{"h":"O que já reduz consumo (decisões do projeto)","items":["Limite de IA por vaga e cache: cortam custo e uso de computação","Retenção e descarte de dados por vaga (LGPD): menos dado guardado","Processo todo digital: candidatura, parecer, contrato e nota fiscal sem papel","Infraestrutura enxuta no começo; só cresce com o volume"],"hl":false},{"h":"O que a equipe pode propor","items":["Perguntar ao provedor a região e a energia do data center antes de contratar","Usar o custo de IA por vaga como indicador de uso de computação","Colocar no relato semestral a linha “ambiental: não medido”","Só medir emissões com fator oficial e dado confiável"],"hl":false}],"note":"“Menos papel” e “menos deslocamento” são efeitos prováveis, mas ninguém mediu: dizer “pode reduzir”, nunca “reduz”."},"src":"Dossiê pp. 49–50, 54; proposta da gaveta","tag":"P","kind":"slide","no":108,"k":7,"kn":12},{"id":"sus-apoio","part":"sus","sec":"sus","layout":"cards","title":"ODS de apoio: onde o projeto também toca (proposta)","sub":"Não estão no dossiê: só entram no relato se ganharem indicador com fonte de dados","data":{"items":[["ODS 5 · Gênero","Igualdade de gênero. Meta 5.1 (fim da discriminação contra mulheres e meninas): critérios como sexo, estado civil e filhos são vetados nas vagas; análise por grupo só quando houver base de dados.","P"],["ODS 16 · Instituições","Paz, justiça e instituições eficazes. Meta 16.6 (instituições responsáveis e transparentes): parecer explicado, trilha de auditoria e direito de pedir revisão (LGPD, art. 20) fazem a decisão automatizada prestar contas.","P"],["ODS 17 · Parcerias","Parcerias e meios de implementação. Meta 17.17 (parcerias eficazes): Senac, associações comerciais e cursos gratuitos de terceiros alimentam a indicação de formação e a captação de empresas.","P"]],"cols":3,"note":"Regra do dossiê: não criar indicador sem fonte. Citar mais ODS sem medir é o risco de “ODS washing”: por isso a equipe mantém 3 ODS (8, 10 e 4)."},"src":"Proposta da gaveta; ONU Brasil, Agenda 2030 (conferir texto oficial das metas)","tag":null,"kind":"slide","no":109,"k":8,"kn":12},{"id":"sus-5w2h","part":"sus","sec":"sus","layout":"table","title":"Plano de implementação (5W2H, resumo)","sub":null,"data":{"cols":["O quê","Quem","Quando","Como"],"rows":[["Linha de base","Guilherme","Piloto (meses 1–2)","Exportar o log das empresas do piloto"],["Instrumentar eventos","Guilherme + desenvolvedor","Mês 0 a 2","Data e hora de cada etapa e mensagem"],["Curadoria de cursos","Cleide","Mês 0 a 2","Lista de cursos gratuitos por competência"],["Painel de ODS","Ricardo","Mês 3","Seis indicadores, série mensal"],["Revisão e relato externo","Equipe + docentes","Mensal/trimestral; semestral","Meta × resultado; relato de uma página com método e limites"]],"hl":[],"first":true,"note":null,"widths":[2.6,3.0,2.8,3.8]},"src":"Dossiê p. 54","tag":null,"kind":"slide","no":110,"k":9,"kn":12},{"id":"sus-gov","part":"sus","sec":"sus","layout":"compare","title":"Governança e semáforo","sub":null,"data":{"cols":[{"h":"Donos","items":["ODS 8 e 4: Guilherme Sousa","ODS 10: Cleide Nogueira","Consolidação: Ricardo Takenaka","Validação: Prof. Leandro Pereira (coleta técnica)"],"hl":true},{"h":"Semáforo","items":["Verde: ≥ 100% da meta","Amarelo: 70% a 99%, plano de correção em 30 dias","Vermelho: < 70% ou sem dado, suspender promessa externa","Dados agregados; relatórios externos não expõem candidatos"],"hl":false}],"note":null},"src":"Dossiê p. 54","tag":null,"kind":"slide","no":111,"k":10,"kn":12},{"id":"sus-risco","part":"sus","sec":"sus","layout":"table","title":"Riscos e salvaguardas dos ODS","sub":null,"data":{"cols":["Risco","Salvaguarda"],"rows":[["Meta sem linha de base","Só vira compromisso externo após 90 dias de medição"],["\"ODS washing\"","Relatório com método, limites e dados agregados"],["Viés nos pareceres","Revisão humana, auditoria amostral mensal, análise por grupo quando houver base"],["Dimensão ambiental","Impacto direto baixo por ser digital; não medido; declarar sem exagero"]],"hl":[],"first":true,"note":null,"widths":[3.6,8.6]},"src":"Dossiê p. 54","tag":null,"kind":"slide","no":112,"k":11,"kn":12},{"id":"sus-qa","part":"sus","sec":"sus","layout":"qa","title":"Se a banca perguntar: o BARD RH é sustentável?","sub":"Resposta de 30 segundos","data":{"q":"O projeto de vocês é sustentável? Quais ODS ele atende de verdade?","a":"Em três dimensões e com limites claros. Social: três ODS (8, 10 e 4) e seis indicadores com meta, dono e fonte, ainda sem medição porque o protótipo roda em simulação. Econômica: negócio em degraus, com capital de volta no mês 34 no cenário realista. Ambiental: impacto direto baixo por ser digital, mas não medido; preferimos declarar isso a prometer o que não sabemos.","nums":[["3 ODS","8, 10 e 4"],["6","indicadores com meta"],["90 dias","de medição antes de prometer"],["mês 34","retorno no realista"]]},"src":"Dossiê pp. 53–54, 100","tag":"H","kind":"slide","no":113,"k":12,"kn":12}],"shortcuts":[["Plano de contingência (IA)",17],["Acessibilidade",19],["Plano LGPD · candidatos",59],["Plano LGPD · empresas",60],["Auditoria: duas frentes",64],["Catálogo de consultoria",76],["Pacotes para empresas",85],["White label",95],["Crescimento escalonado",35],["Caixa por semestre (filtro)",28],["Sustentabilidade e ODS",102],["Resposta: é sustentável?",113]],"tags":{"V":"VERIFICADO","R":"RECALCULADO","E":"ESTIMATIVA","C":"CONFIRMAR","H":"HIPÓTESE","P":"PROPOSTA","L":"LEI / NORMA"},"full":null};window.LOGO_DARK="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAPYAAAEGCAYAAABW92hlAACBdUlEQVR42uz9aZBd533mCf6e99wtVyABJEAsBEAQAKlMLrJAbZZtJlW2q2S3q6cq5kK9VbcjekKOmJ6oiajpz8KFv09NlGNmIsSoantcFdWhvDMdPe2xVN6EpC2JWpgSt0yBIAgSxEYgASSQ+13O+8yHc24iAVESCSRAgLz/iBOZSOQ97z033//7359HdOUDiY0AJHw7r1uVWvbv+uiNnw8PPyuAgYGF1Z9NTsLBg/0em3nBVIlA/gbw2nvW64Rq9cZ7qtdv/F8VYArVR/Hw8J5i35lkv508Z2lEpizRjlhGQehabMdXt+z5J9898OU/OS0ptR0A5xeS3N0JD4ao+xGsv2IbVn+rVkO12ur31Gr41nsYJ /* ---------- formatação ---------- */

  }).join('');
  const q = `<a href="${esc(fl(FULL.banca))}" target="_blank" rel="noopener">Se a banca perguntar… ↗</a><a href="${esc(fl(FULL.chaves))}" target="_blank" rel="noopener">Números-chave ↗</a><a href="${esc(fl(FULL.resp))}" target="_blank" rel="noopener">Respostas-relâmpago ↗</a><a href="${esc(fl(FULL.selos))}" target="_blank" rel="noopener">Selos de confiança ↗</a><a href="${esc(fl(FULL.caixa))}" target="_blank" rel="noopener">Cenários e caixa ↗</a><a class="alt" href="${esc(FULL_URL)}" target="_blank" rel="noopener">Abrir o modo completo ↗</a>`;
  return `<div class="body"><div class="head"><div class="kick">Modo completo · navegação</div><h2 class="title" style="font-size:30px">Menu do modo completo: partes e estudos</h2><div class="sub">Os ${FULL.total} slides originais, sem alterações. Os links abrem o arquivo “Slides de gaveta” em nova aba; ele precisa estar na mesma pasta (ou use ?full=endereço).</div></div><div class="content" data-fs="16" style="overflow:visible"><div class="mcont"><div class="menu-grid">${cols}</div><div class="quick">${q}</div></div></div></div>`;
}
function secBody(s){
  const p = pilBy[s.sec], items = SL.filter(x => x.sec === p.key && x.kind === 'slide');
  const fs = items.length >= 11 ? 15.5 : items.length >= 9 ? 17 : 19;
  const lst = items.map(x => `<a href="#s-${x.no}"><i>${x.k}</i><span>${esc(x.title)}</span>${x.tag ? `<u class="t-${x.tag}"></u>` : ''}<em>${x.no}</em></a>`).join('');
  const fp = p.full.map(([lab, no]) => `<a href="${esc(fl(no))}" target="_blank" rel="noopener"><span>${esc(lab)}</span><em>${no} ↗</em></a>`).join('');
  return `<div class="body" style="padding:0"><div class="dk-main secd dk" style="padding:30px 50px 0;justify-content:flex-start"><div class="kk">${SA ? 'Pilar' : 'Modo compacto · pilar'} ${p.num + 1} de ${D.pillars.length}</div><div class="nm">${esc(p.name)}</div><div class="qq2">${esc(p.q)}</div><div class="mt">${esc(p.intro)}</div><div class="sdw" style="${SA ? 'grid-template-columns:1fr' : ''}"><div class="lst" style="font-size:${fs}px">${lst}</div>${SA ? '' : `<aside class="fullp"><h5>Aprofundar no modo completo</h5>${fp}<small>Abre em nova aba, no slide indicado.</small></aside>`}</div></div></div>`;
}

/* ---------- slide completo ---------- */
function slideEl(s){
  const dark = ['cover', 'sec'].includes(s.kind);
  const el = document.createElement('section');
  el.className = 'slide' + (dark ? ' dark' : '') + (s.kind === 'cover' ? ' cover' : '') + (s.kind === 'sec' ? ' secd' : '');
  el.id = 's-' + s.no; el.dataset.no = s.no; el.dataset.layout = s.layout || s.kind;
  let inner;
  if (s.kind === 'cover') inner = coverHtml();
  else if (s.kind === 'sec') inner = secBody(s);
  else if (s.kind === 'menu') inner = menuBody();
  else if (s.kind === 'fmenu' && !SA) inner = fmenuBody();
  else {
    const p = pilBy[s.sec];
    const note = s.data.note ? `<div class="note"><b style="color:var(--gold-d)">Nota · </b>${esc(s.data.note)}</div>` : '';
    const ctr = ['cards', 'steps', 'timeline', 'compare', 'bars', 'stats'].includes(s.layout);
    inner = `<div class="body"><div class="head"><div class="kick">${esc(p.name)}</div><h2 class="title" style="font-size:${titleSize(s.title)}px">${esc(s.title)}</h2>${s.sub ? `<div class="sub" style="font-size:${s.sub.length > 190 ? 14 : 16}px">${esc(s.sub)}</div>` : ''}</div><div class="content${ctr ? ' ctr' : ''}" data-fs="${BASEFS[s.layout] || 16}">${L[s.layout](s)}</div>${note}</div>`;
  }
  el.innerHTML = navHtml(s) + inner + footHtml(s);
  return el;
}
function overflows(c){ if (c.scrollHeight > c.clientHeight + 2 || c.scrollWidth > c.clientWidth + 2) return true; for (const e of c.querySelectorAll('.cd,.sp,.ti,.cc,.st,.aa,.qq,.exc,.ex-what,.ex-dec,.kp')) if (e.scrollHeight > e.clientHeight + 2) return true; return false; }
function simOverflow(el){
  const t = el.querySelector('.sim-tbl'), c = el.querySelector('.content'); if (!t || !c) return false;
  return t.scrollHeight > t.clientHeight + 2 || c.scrollHeight > c.clientHeight + 2 || el.querySelector('.sim').scrollHeight > el.querySelector('.sim').clientHeight + 2;
}
function post(el, s){
  if (s.layout === 'sim') { renderSim(el, s); if (simOverflow(el)) el.dataset.overflow = '1'; return; }
  const box = el.querySelector('[data-chart]');
  if (box) { drawChart(box, s.data); return; }
  const c = el.querySelector('.content'); if (!c || s.kind !== 'slide') return;
  let fs = parseFloat(c.dataset.fs || 16); c.style.setProperty('--fs', fs + 'px');
  let g = 0; while (g++ < 60 && overflows(c) && fs > MINFS) { fs -= 0.5; c.style.setProperty('--fs', fs + 'px'); }
  if (!overflows(c)) {
    const cap = CAP[s.layout] || fs;
    g = 0; while (g++ < 40 && fs < cap) { c.style.setProperty('--fs', (fs + 0.5) + 'px'); if (overflows(c)) { c.style.setProperty('--fs', fs + 'px'); break; } fs += 0.5; }
  }
  if (s.layout === 'table' && !overflows(c)) {
    let tp = 0; while (tp < 14) { c.style.setProperty('--tp', (tp + 1) + 'px'); if (overflows(c)) { c.style.setProperty('--tp', tp + 'px'); break; } tp++; }
  }
  c.dataset.final = fs;
  if (overflows(c)) el.dataset.overflow = '1';
  if (fs < SMALL) el.dataset.small = '1';
}

/* ---------- aplicação ---------- */
let cur = 0;
function show(no, push){
  no = Math.max(1, Math.min(N, no));
  const stage = document.getElementById('stage'); stage.innerHTML = '';
  const s = SL[no - 1], el = slideEl(s); stage.appendChild(el); post(el, s); cur = no;
  
  if (push !== false && location.hash !== '#s-' + no) history.replaceState(null, '', '#s-' + no);
  document.querySelectorAll('#tree .it.cur').forEach(x => x.classList.remove('cur'));
  const t = document.querySelector(`#tree .it[data-no="${no}"]`); if (t) t.classList.add('cur');
  document.title = `${s.title} · BARD RH · ${SA ? 'Resumo Executivo' : 'Hub'}`;
}
function fitStage(){
  const w = document.getElementById('stagewrap'), st = document.getElementById('stage');
  st.style.transform = `scale(${Math.min(w.clientWidth / 1280, w.clientHeight / 720)})`;
}
function buildTree(){
  const acc = D.pillars.map((p, pi) => {
    const items = SL.filter(x => x.sec === p.key);
    const h = items.map(x => `<div class="it" data-no="${x.no}"><span class="n">${x.no}</span><span>${x.kind === 'sec' ? '<b>Abertura do pilar</b>' : esc(x.title)}</span></div>`).join('') +
      (SA ? '' : `<div class="sechd">Modo completo ↗</div>`) + (SA ? [] : p.full).map(([lab, no]) => `<a class="it ext" href="${esc(fl(no))}" target="_blank" rel="noopener"><span class="n">${no}</span><span>${esc(lab)}</span></a>`).join('');
    return `<div class="accordion-item"><h2 class="accordion-header"><button class="accordion-button ${pi === 0 ? '' : 'collapsed'}" type="button" data-bs-toggle="collapse" data-bs-target="#ap${pi}">${p.num + 1} · ${esc(p.name)}</button></h2><div id="ap${pi}" class="accordion-collapse collapse ${pi === 0 ? 'show' : ''}" data-bs-parent="#tree"><div class="accordion-body">${h}</div></div></div>`;
  }).join('');
  document.getElementById('tree').innerHTML = `<div class="sechd">Navegação</div><div class="it" data-no="1"><span class="n">1</span><span><b>Página inicial</b></span></div><div class="it" data-no="2"><span class="n">2</span><span><b>Menu dos pilares</b></span></div>${SA ? '' : '<div class="it" data-no="3"><span class="n">3</span><span><b>Menu do modo completo</b></span></div>'}` + `<div class="accordion" id="accP">${acc}</div>`;
  const fa2 = (SA ? [] : FULL.parts).map((p, pi) => {
    let h = `<a class="it ext" href="${esc(fl(p.first))}" target="_blank" rel="noopener"><span class="n">${p.first}</span><span><b>${p.key === '0' ? 'Início do material' : 'Abertura da parte'}</b></span></a>`;
    p.secs.forEach(sc => { h += `<div class="sechd">${esc(sc.label)} · ${esc(sc.name)}</div><a class="it ext" href="${esc(fl(sc.first))}" target="_blank" rel="noopener"><span class="n">${sc.first}</span><span><b>Índice do estudo</b></span></a>` + sc.slides.map(x => `<a class="it ext" href="${esc(fl(x[0]))}" target="_blank" rel="noopener"><span class="n">${x[0]}</span><span>${esc(x[1])}</span></a>`).join(''); });
    return `<div class="accordion-item"><h2 class="accordion-header"><button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#af${pi}">${esc(p.name)}</button></h2><div id="af${pi}" class="accordion-collapse collapse" data-bs-parent="#treef"><div class="accordion-body">${h}</div></div></div>`;
  }).join('');
  document.getElementById('treef').innerHTML = SA ? '' : `<div class="hint">Os ${FULL.total} slides do modo completo. Cada link abre em nova aba.</div><div class="accordion" id="accF">${fa2}</div>`;
}
function flat(o){ if (o == null) return ''; if (typeof o !== 'object') return String(o); return (Array.isArray(o) ? o : Object.values(o)).map(flat).join(' '); }
const IDX = SL.map(s => norm([s.title, s.sub, flat(s.data), s.src, s.sec && pilBy[s.sec] ? pilBy[s.sec].name : ''].join(' ')));
const FIDX = (SA ? [] : FULL.flat).map(x => norm(x[1] + ' ' + x[2]));
function search(q){
  const r = document.getElementById('results'), box = document.getElementById('trees');
  q = norm(q.trim());
  if (!q) { r.innerHTML = ''; box.style.display = ''; return; }
  box.style.display = 'none';
  const words = q.split(/\s+/), a = [], b = [];
  SL.forEach((s, i) => { if (s.kind !== 'cover' && s.kind !== 'fmenu' && words.every(w => IDX[i].includes(w))) a.push(s); });
  (SA ? [] : FULL.flat).forEach((x, i) => { if (words.every(w => FIDX[i].includes(w))) b.push(x); });
  r.innerHTML = `<div class="sechd">${a.length} resultado(s)</div>` + a.slice(0, 40).map(s => `<div class="it" data-no="${s.no}"><span class="n">${s.no}</span><span>${esc(s.title)}<span class="st">${esc(s.sec && pilBy[s.sec] ? pilBy[s.sec].name : 'Navegação')}</span></span></div>`).join('') +
    (SA ? '' : `<div class="sechd">Modo completo · ${b.length} resultado(s) (títulos) ↗</div>`) + b.slice(0, 40).map(x => `<a class="it ext" href="${esc(fl(x[0]))}" target="_blank" rel="noopener"><span class="n">${x[0]}</span><span>${esc(x[1])}<span class="st">${esc(x[2])}</span></span></a>`).join('');
}
function toggleFS(){ if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); }
function bindNav(root){
  root.addEventListener('click', e => {
    if (e.target.closest('[data-open="menu"]')) { e.preventDefault(); bootstrap.Offcanvas.getOrCreateInstance(document.getElementById('menu')).show(); return; }
    if (e.target.closest('.fsb')) { toggleFS(); return; }
    const sb = e.target.closest('.seg button[data-m]');
    if (sb) { SIM.mode = sb.dataset.m; const el = document.querySelector('.slide'); if (el && el.querySelector('[data-sim]')) renderSim(el, SL[cur - 1]); return; }
    const a = e.target.closest('a[href^="#s-"]');
    if (a) { e.preventDefault(); show(parseInt(a.getAttribute('href').slice(3), 10)); return; }
    const it = e.target.closest('.it[data-no]');
    if (it) { show(parseInt(it.dataset.no, 10)); const oc = bootstrap.Offcanvas.getInstance(document.getElementById('menu')); if (oc) oc.hide(); }
  });
}
function initApp(){
  buildTree(); fitStage();
  window.addEventListener('resize', () => { fitStage(); });
  bindNav(document.getElementById('stage')); bindNav(document.getElementById('menu'));
  document.getElementById('q').addEventListener('input', e => search(e.target.value));
  document.querySelectorAll('#modes button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('#modes button').forEach(x => x.classList.toggle('on', x === b));
    document.getElementById('tree').style.display = b.dataset.t === 'tree' ? '' : 'none';
    document.getElementById('treef').style.display = b.dataset.t === 'treef' ? '' : 'none';
  }));
  document.getElementById('treef').style.display = 'none';
  document.addEventListener('keydown', e => {
    if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) { if (e.key === 'Escape') document.activeElement.blur(); return; }
    const oc = bootstrap.Offcanvas.getOrCreateInstance(document.getElementById('menu'));
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); show(cur + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); show(cur - 1); }
    else if (e.key === 'Home') show(1); else if (e.key === 'End') show(N);
    else if (e.key === 'm' || e.key === 'M') oc.toggle();
    else if (e.key === '/') { e.preventDefault(); oc.show(); setTimeout(() => document.getElementById('q').focus(), 300); }
    else if (e.key === 'f' || e.key === 'F') toggleFS();
    else if ('1234'.includes(e.key) && document.querySelector('[data-sim]')) { const b = document.querySelector(`.seg button:nth-child(${e.key})`); if (b) b.click(); }
  });
  window.addEventListener('hashchange', () => { const m = /^#s-(\d+)$/.exec(location.hash); if (m && +m[1] !== cur) show(+m[1], false); });
  const m = /^#s-(\d+)$/.exec(location.hash); show(m ? +m[1] : 1, false);
  if (QS.has('menu')) bootstrap.Offcanvas.getOrCreateInstance(document.getElementById('menu')).show();
  const hs = document.getElementById('stagewrap'); let sx = null;
  hs.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, {passive: true});
  hs.addEventListener('touchend', e => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 60) show(cur + (dx < 0 ? 1 : -1)); sx = null; });
}
function initPrint(){
  document.body.classList.add('print');
  const st = document.getElementById('stage'); st.innerHTML = '';
  SL.forEach(s => st.appendChild(slideEl(s)));
  const run = () => {
    const ov = [], sm = [], sims = [];
    st.querySelectorAll('.slide').forEach((el, i) => {
      post(el, SL[i]); if (el.dataset.overflow) ov.push(SL[i].no); if (el.dataset.small) sm.push(SL[i].no + ':' + (el.querySelector('.content') || {dataset: {}}).dataset.final);
      if (SL[i].layout === 'sim') ['pess', 'real', 'otim', 'cmp'].forEach(m => { SIM.mode = m; renderSim(el, SL[i]); if (simOverflow(el)) sims.push(m); });
    });
    SIM.mode = 'real'; st.querySelectorAll('.slide').forEach((el, i) => { if (SL[i].layout === 'sim') renderSim(el, SL[i]); });
    document.body.dataset.ready = '1'; document.body.dataset.overflow = ov.join(','); document.body.dataset.small = sm.join(','); document.body.dataset.simover = sims.join(',');
  };
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(run, 60));
}
window.addEventListener('DOMContentLoaded', () => {
  if (PRINT) initPrint();
  else (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(initApp);
});
window.HUBAPP = {show};
})();
</script>
